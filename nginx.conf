# Configuration nginx — sert l'Angular compilé (SPA).
# try_files : toute route inconnue (ex: /admin/dashboard rafraîchi) renvoie index.html
# -> le routeur Angular prend le relais (évite les 404 au refresh).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fichiers statiques hashés (main-XXXX.js...) : cache long, sans risque
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Fallback SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
