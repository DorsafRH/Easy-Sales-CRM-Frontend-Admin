<div class="notifications-page">

  <div class="notifications-page__header">
    <div class="notifications-page__header-left">
      <h2 class="notifications-page__title">Notifications</h2>
      <span class="notifications-page__count" *ngIf="!isLoading()">
        {{ totalElements() }} notification{{ totalElements() > 1 ? 's' : '' }}
      </span>
    </div>
    <button
      class="notifications-page__mark-all"
      (click)="marquerToutesCommeLues()"
      *ngIf="aNonLues()"
    >
      Tout marquer comme lu
    </button>
  </div>

  <app-spinner *ngIf="isLoading()" label="Chargement des notifications..." />

  <div class="notif-list" *ngIf="!isLoading()">

    <div class="notif-empty" *ngIf="notifications().length === 0">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.5" width="48" height="48">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0
             0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0
             01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714
             0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0"/>
      </svg>
      <p>Aucune notification pour le moment</p>
    </div>

    <div
      *ngFor="let notif of notifications()"
      class="notif-item"
      [class.notif-item--non-lue]="!notif.lue"
      (click)="marquerCommeLue(notif)"
    >
      <!-- Icône selon le type de notification -->
      <div class="notif-item__icon notif-item__icon--{{ iconeType(notif.type) }}">

        <!-- Nouvelle inscription -->
        <svg *ngIf="iconeType(notif.type) === 'inscription'"
          viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          width="18" height="18">
          <path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <line x1="19" y1="8" x2="19" y2="14"/>
          <line x1="22" y1="11" x2="16" y2="11"/>
        </svg>

        <!-- Modification entreprise -->
        <svg *ngIf="iconeType(notif.type) === 'modification'"
          viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          width="18" height="18">
          <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>

        <!-- Info -->
        <svg *ngIf="iconeType(notif.type) === 'info'"
          viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          width="18" height="18">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="16" x2="12" y2="12"/>
          <line x1="12" y1="8" x2="12.01" y2="8"/>
        </svg>

      </div>

      <!-- Contenu de la notification -->
      <div class="notif-item__content">
        <div class="notif-item__header">
          <span class="notif-item__titre">{{ notif.titre }}</span>
          <span class="notif-item__date">{{ formatDate(notif.dateCreation) }}</span>
        </div>
        <p class="notif-item__message">{{ notif.message }}</p>
      </div>

      <!-- Point bleu indicateur non lu -->
      <div class="notif-item__dot" *ngIf="!notif.lue"></div>

    </div>

    <!-- Pagination -->
    <div class="pagination" *ngIf="totalPages > 1">
      <button
        class="pagination__btn"
        [disabled]="currentPage === 0"
        (click)="goToPage(currentPage - 1)"
      >
        Précédent
      </button>
      <div class="pagination__numbers">
        <button
          *ngFor="let p of pageNumbers()"
          class="pagination__num"
          [class.pagination__num--active]="p === currentPage"
          (click)="goToPage(p)"
        >
          {{ p + 1 }}
        </button>
      </div>
      <button
        class="pagination__btn"
        [disabled]="currentPage >= totalPages - 1"
        (click)="goToPage(currentPage + 1)"
      >
        Suivant
      </button>
    </div>

  </div>

</div>
