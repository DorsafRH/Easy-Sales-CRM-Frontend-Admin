<aside class="sidebar">

  <div class="sidebar__logo">
    <div class="sidebar__logo-icon">E</div>
    <div>
      <span class="sidebar__logo-name">Easy Sales CRM</span>
      <span class="sidebar__logo-role">Super Admin</span>
    </div>
  </div>

  <nav class="sidebar__nav">
    <span class="sidebar__section-label">Gestion</span>

    <!-- Dashboard -->
    <a
      class="sidebar__item"
      routerLink="/admin/dashboard"
      routerLinkActive="sidebar__item--active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7"/>
        <rect x="14" y="3" width="7" height="7"/>
        <rect x="14" y="14" width="7" height="7"/>
        <rect x="3" y="14" width="7" height="7"/>
      </svg>
      <span class="sidebar__label">Dashboard</span>
    </a>

    <!-- Entreprises -->
    <a
      class="sidebar__item"
      routerLink="/admin/entreprises"
      routerLinkActive="sidebar__item--active"
      [routerLinkActiveOptions]="{ exact: false }"
    >
      <svg class="sidebar__icon" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd"
          d="M4 4a2 2 0 012-2h8a2 2 0 012 2v12a1 1 0 01-1 1H5a1 1
             0 01-1-1V4zm3 1h2v2H7V5zm0 4h2v2H7V9zm0 4h2v2H7v-2zm4-8h2v2h-2V5zm0
             4h2v2h-2V9zm0 4h2v2h-2v-2z"
          clip-rule="evenodd"
        />
      </svg>
      <span class="sidebar__label">Entreprises</span>
    </a>

    <!-- Notifications -->
    <a
      class="sidebar__item"
      routerLink="/admin/notifications"
      routerLinkActive="sidebar__item--active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 01-3.46 0"/>
      </svg>
      <span class="sidebar__label">Notifications</span>
      <span class="sidebar__badge" *ngIf="nbNotifications() > 0">
        {{ nbNotifications() }}
      </span>
    </a>

  </nav>

  <div class="sidebar__footer">
    <div class="sidebar__user">
      <div class="sidebar__avatar">{{ initiales() }}</div>
      <div class="sidebar__user-info">
        <span class="sidebar__user-name">{{ nomComplet() }}</span>
        <span class="sidebar__user-role">Super Admin</span>
      </div>
    </div>
    <button class="sidebar__logout" (click)="logout()" title="Se déconnecter">
      <svg viewBox="0 0 20 20" fill="currentColor" width="18" height="18">
        <path fill-rule="evenodd"
          d="M3 3a1 1 0 00-1 1v12a1 1 0 001 1h7a1 1 0 000-2H4V5h6a1 1
             0 000-2H3zm11.293 4.293a1 1 0 011.414 0l3 3a1 1 0 010
             1.414l-3 3a1 1 0 01-1.414-1.414L15.586 11H9a1 1 0
             010-2h6.586l-1.293-1.293a1 1 0 010-1.414z"
          clip-rule="evenodd"
        />
      </svg>
    </button>
  </div>

</aside>
